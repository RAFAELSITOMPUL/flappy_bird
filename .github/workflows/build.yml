name: Build & Release Flappy Bird (Windows Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-and-release:
    name: 💻 Build & Release Windows Desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Download & Setup Godot ${{ env.GODOT_VERSION }}
        shell: pwsh
        run: |
          $templatesPath = "$env:APPDATA\Godot\export_templates\${{ env.GODOT_VERSION }}.stable"
          New-Item -ItemType Directory -Force -Path $templatesPath
          
          # Download Godot Engine for Windows
          Write-Host "Downloading Godot Windows binary..."
          curl.exe -L -o godot_win.zip https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_win64.exe.zip
          Expand-Archive -Path godot_win.zip -DestinationPath ./godot_bin -Force
          
          # Download Export Templates
          Write-Host "Downloading Godot Export Templates..."
          curl.exe -L -o godot_templates.tpz https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          Expand-Archive -Path godot_templates.tpz -DestinationPath ./temp_templates -Force
          Copy-Item -Path ./temp_templates/templates/* -Destination $templatesPath -Recurse -Force
          
          Write-Host "Godot and Templates setup complete!"

      - name: Export Windows Standalone EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "builds\windows", "release"
          
          $godotExe = (Get-ChildItem -Path ./godot_bin -Filter "*console.exe").FullName
          if (-not $godotExe) {
              $godotExe = (Get-ChildItem -Path ./godot_bin -Filter "*.exe").FullName[0]
          }
          
          Write-Host "Executing Godot Export using: $godotExe"
          
          # Run export synchronously and wait for completion
          $p = Start-Process -FilePath $godotExe -ArgumentList @("--headless", "--export-release", "Windows Desktop", "builds\windows\FlappyBird.exe") -NoNewWindow -PassThru -Wait
          
          if ($p.ExitCode -ne 0) {
              Write-Error "Godot export failed with exit code $($p.ExitCode)"
              exit $p.ExitCode
          }
          
          # Verify FlappyBird.exe was generated
          if (Test-Path "builds\windows\FlappyBird.exe") {
              Write-Host "FlappyBird.exe generated successfully! Size: $((Get-Item 'builds\windows\FlappyBird.exe').Length) bytes"
              Copy-Item "builds\windows\FlappyBird.exe" "release\FlappyBird.exe" -Force
          } else {
              Write-Error "FlappyBird.exe not found after export!"
              exit 1
          }

      - name: Compile Windows 11 Administrator Installer (Inno Setup)
        shell: pwsh
        run: |
          cd builds\windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ..\..\installer\installer.iss
          cd ..\..
          
          if (Test-Path "release\FlappyBird-Setup-v1.0.0.exe") {
              Write-Host "Installer built successfully! Size: $((Get-Item 'release\FlappyBird-Setup-v1.0.0.exe').Length) bytes"
          } else {
              Write-Error "Installer binary was not created!"
              exit 1
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows-Installer
          path: release/FlappyBird-Setup-v1.0.0.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FlappyBird-Setup-v1.0.0.exe
            release/FlappyBird.exe
          tag_name: v1.0.0
          name: "FLAPPY BIRD 2D v1.0.0 (Windows Installer & Standalone)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 FLAPPY BIRD 2D (Windows 11 / 10 Installer)
            
            ### 📥 Pilihan File:
            1. **`FlappyBird-Setup-v1.0.0.exe`** *(Rekomendasi)*:
               - **Installer Resmi Windows**: Otomatis meminta hak akses **Administrator**.
               - Menginstal game langsung ke dalam folder SSD (`C:\Program Files\Flappy Bird`).
               - Membuat icon shortcut otomatis di **Desktop** & **Start Menu**.
               - Checklist *"Launch Flappy Bird"* agar langsung terbuka saat selesai install!
               - Dilengkapi **Uninstaller Resmi** di Windows Control Panel / Settings.
            
            2. **`FlappyBird.exe`**:
               - Versi Portable Standalone (bisa langsung dijalankan tanpa instalasi).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}