name: Build & Release Flappy Bird (Windows Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-and-release:
    name: 💻 Build & Release Windows Desktop
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Setup Godot Linux for Headless Export in WSL/Bash
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64
          mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/bin/godot
          
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip -q templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
          
          mkdir -p builds/windows release
          godot --headless --export-release "Windows Desktop" builds/windows/FlappyBird.exe
          cp builds/windows/FlappyBird.exe release/FlappyBird.exe

      - name: Compile Windows 11 Administrator Installer (Inno Setup)
        shell: pwsh
        run: |
          cd builds\windows
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ..\..\installer\installer.iss
          cd ..\..
          
          Get-ChildItem -Path release\

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows-Installer
          path: release/FlappyBird-Setup-v1.0.0.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FlappyBird-Setup-v1.0.0.exe
            release/FlappyBird.exe
          tag_name: v1.0.0
          name: "FLAPPY BIRD 2D v1.0.0 (Windows Installer & Standalone)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 FLAPPY BIRD 2D (Windows 11 / 10 Installer)
            
            ### 📥 Pilihan File:
            1. **`FlappyBird-Setup-v1.0.0.exe`** *(Rekomendasi)*:
               - **Installer Resmi Windows**: Otomatis meminta hak akses **Administrator**.
               - Menginstal game langsung ke dalam folder SSD (`C:\Program Files\Flappy Bird`).
               - Membuat icon shortcut otomatis di **Desktop** & **Start Menu**.
               - Checklist *"Launch Flappy Bird"* agar langsung terbuka saat selesai install!
               - Dilengkapi **Uninstaller Resmi** di Windows Control Panel / Settings.
            
            2. **`FlappyBird.exe`**:
               - Versi Portable Standalone (bisa langsung dijalankan tanpa instalasi).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}