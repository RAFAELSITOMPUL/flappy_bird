name: Build & Release Flappy Bird (Windows Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-and-release:
    name: 💻 Build & Release Windows Desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Innoextract & Inno Setup via Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine32 wine64 innoextract p7zip-full
          
          # Download official Inno Setup QuickInstall
          curl -LO https://files.jrsoftware.org/is/6/innosetup-6.3.3.exe
          mkdir -p ~/.inno
          innoextract -d ~/.inno/ innosetup-6.3.3.exe

      - name: Setup Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Export Windows Standalone EXE
        run: |
          mkdir -p builds/windows release
          godot --headless --export-release "Windows Desktop" builds/windows/FlappyBird.exe
          cp builds/windows/FlappyBird.exe release/FlappyBird.exe
          ls -la builds/windows/

      - name: Compile Windows 11 Administrator Installer
        run: |
          cd builds/windows
          wine ~/.inno/app/ISCC.exe ../../installer/installer.iss
          cd ../..
          ls -la release/

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows-Installer
          path: release/FlappyBird-Setup-v1.0.0.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/FlappyBird-Setup-v1.0.0.exe
            release/FlappyBird.exe
          tag_name: v1.0.0
          name: "FLAPPY BIRD 2D v1.0.0 (Windows Installer & Standalone)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 FLAPPY BIRD 2D (Windows 11 / 10 Installer)
            
            ### 📥 Pilihan File:
            1. **`FlappyBird-Setup-v1.0.0.exe`** *(Rekomendasi)*:
               - **Installer Resmi Windows**: Otomatis meminta hak akses **Administrator**.
               - Menginstal game langsung ke dalam folder SSD (`C:\Program Files\Flappy Bird`).
               - Membuat icon shortcut otomatis di **Desktop** & **Start Menu**.
               - Checklist *"Launch Flappy Bird"* agar langsung terbuka saat selesai install!
            
            2. **`FlappyBird.exe`**:
               - Versi Portable Standalone (bisa langsung dijalankan tanpa instalasi).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}