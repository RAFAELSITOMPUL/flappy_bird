name: Build & Release Flappy Bird (Windows Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-and-release:
    name: 💻 Build & Release Windows Desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Export Windows Project
        run: |
          mkdir -p builds/windows release
          godot --headless --export-release "Windows Desktop" builds/windows/FlappyBird.exe

      - name: Package Windows ZIP
        run: |
          cd builds/windows
          zip -r ../../release/FlappyBird-Windows.zip .
          cd ../..

      - name: Upload Windows Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows
          path: release/FlappyBird-Windows.zip

      - name: Publish GitHub Release (Latest)
        uses: softprops/action-gh-release@v2
        with:
          files: release/FlappyBird-Windows.zip
          tag_name: v1.0.0
          name: "FLAPPY BIRD 2D v1.0.0 (Windows Build)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 FLAPPY BIRD 2D (Windows Desktop)
            
            Game Flappy Bird 2D siap dimainkan di PC/Laptop Windows!
            
            ### 💻 Cara Install & Mainkan:
            1. Download file **`FlappyBird-Windows.zip`** di bawah (bagian Assets).
            2. Extract/Unzip file tersebut ke folder di komputer Anda.
            3. Buka folder hasil extract, lalu double-click **`FlappyBird.exe`** untuk bermain! 🐦✨
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}