name: Build & Release Flappy Bird (Windows Desktop)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3
  PROJECT_PATH: .

jobs:
  build-and-release:
    name: 💻 Build & Release Windows Desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot ${{ env.GODOT_VERSION }} & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot
          
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip -q Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/

      - name: Export Standalone Windows EXE
        run: |
          mkdir -p release builds/windows
          godot --headless --export-release "Windows Desktop" release/FlappyBird.exe
          cp release/FlappyBird.exe builds/windows/FlappyBird.exe

      - name: Upload Windows Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-Windows-EXE
          path: release/FlappyBird.exe

      - name: Publish GitHub Release (FlappyBird.exe)
        uses: softprops/action-gh-release@v2
        with:
          files: release/FlappyBird.exe
          tag_name: v1.0.0
          name: "FLAPPY BIRD 2D v1.0.0 (Windows EXE)"
          draft: false
          prerelease: false
          body: |
            ## 🎮 FLAPPY BIRD 2D (Windows Standalone EXE)
            
            Game Flappy Bird 2D siap dimainkan langsung di Windows!
            
            ### 📥 Cara Download & Main:
            1. Download file **`FlappyBird.exe`** di bagian **Assets** di bawah.
            2. Double-click (atau klik kanan -> *Run as administrator*) pada **`FlappyBird.exe`**.
            3. Game langsung terbuka tanpa perlu extract atau install apa pun! 🐦✨
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}